openapi: 3.0.3
info:
  title: Travel Super App API
  version: 1.0.0
  description: Phase 1 contract. All responses include data or error and a request_id.
servers:
  - url: http://localhost:8082/api/v1
paths:
  /auth/register:
    post:
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': { description: Account created }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { description: Session token returned }
  /trips:
    get:
      summary: List the authenticated user's trips (newest first)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }]
      responses:
        '200': { description: "Array of trips (data is always an array, possibly empty)" }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a trip (status DRAFT). Empty start_date/end_date mean "not set".
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201': { description: Trip created }
        '400': { $ref: '#/components/responses/ValidationError' }
  /trips/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      summary: Get one trip with its day-by-day itinerary
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "Trip including days[].activities[]" }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Partially update a trip; omitted fields are unchanged, empty dates clear the date
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200': { description: Updated trip }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Soft-delete a trip
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /trips/{id}/activities:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      summary: Add an itinerary item; the trip day is created on first use. Times are wall-clock at the destination (no time zone conversion).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
      responses:
        '201': { description: Activity created }
        '400': { description: "Invalid input, or date outside the trip's dates" }
        '404': { $ref: '#/components/responses/NotFound' }
  /trips/{id}/activities/{activityId}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { name: activityId, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Remove an itinerary item
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications:
    get:
      summary: List the caller's notifications (newest first) with the total unread count
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: unread, in: query, schema: { type: boolean }, description: "true = only unread" }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: Notification[], unread_count: integer }" }
  /notifications/read-all:
    post:
      summary: Mark all of the caller's notifications as read
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "data: { updated: integer }" }
  /notifications/{id}/read:
    patch:
      summary: Mark one notification as read (idempotent)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Marked read }
        '404': { $ref: '#/components/responses/NotFound' }
  /reviews:
    get:
      summary: List reviews of one subject with count and average
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: subject_type, in: query, required: true, schema: { $ref: '#/components/schemas/ReviewSubjectType' } }
        - { name: subject_id, in: query, required: true, schema: { type: string, maxLength: 36 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: Review[], summary: { count, average } }" }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Review a subject. One review per user per subject; the subject's existence is not verified by the API.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201': { description: Review created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: The caller already reviewed this subject }
  /reviews/mine:
    get:
      summary: List the caller's own reviews
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }]
      responses:
        '200': { description: "data: { items: Review[] }" }
  /reviews/{id}:
    delete:
      summary: Delete one of the caller's own reviews
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /tags:
    get:
      summary: Popular tags by public use (review tags only; private trip tags never counted)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "Slug prefix for autocomplete; % and _ are literal" }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: Tag[] ({slug, label, uses})" }
  /tags/{slug}/content:
    get:
      summary: Ids of content carrying a tag that the caller may see (own trips; any non-deleted review)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [TRIP, REVIEW, COMMUNITY_POST] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: string[] }" }
        '400': { $ref: '#/components/responses/ValidationError' }
  /content/{type}/{id}/tags:
    get:
      summary: "Tags of one item (trips: owner only; reviews and community posts: any signed-in user)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [TRIP, REVIEW, COMMUNITY_POST] } }
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { description: "data: Tag[] ({slug, label})" }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Replace the tag set of one item (idempotent; owner/author only; max 10 tags of at most 30 characters)
      description: "Tags are normalised to a lowercase slug; letters of any script (Thai included), digits, spaces and '-' are allowed, anything else is a 400. Duplicate slugs collapse; an empty list clears."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [TRIP, REVIEW, COMMUNITY_POST] } }
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tags], properties: { tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } } } }
      responses:
        '200': { description: "data: Tag[]" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me:
    get:
      summary: "Who the caller is and what they may do (roles and permissions, read from the database)"
      description: Clients use this only to decide which screens to offer. The server still checks every action.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "data: { id, email, roles: string[], permissions: string[] }" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /portal/bookings:
    get:
      summary: "STAFF: booking work queue (needs booking.manage)"
      description: Newest first. Every row has next_statuses from the server's transition rules; financial statuses such as PAID offer none.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, pattern: '^[A-Za-z_]{1,30}$' } }
        - { name: q, in: query, description: Booking code contains (max 40), schema: { type: string, maxLength: 40 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: [{id, booking_code, status, currency, total_amount, customer_email, created_at, next_statuses}], total, limit, offset }" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /portal/disputes:
    get:
      summary: "STAFF: dispute work queue (needs support.manage)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, pattern: '^[A-Za-z_]{1,30}$' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: [{id, booking_id, booking_code, reason, description, status, opened_by_email, assigned_staff_id, resolution, created_at, next_statuses}], total, limit, offset }" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /portal/partners:
    get:
      summary: "STAFF: partner applications and partners (needs partner.review)"
      description: Oldest first so the longest-waiting application is on top.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, pattern: '^[A-Za-z_]{1,30}$' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: [{id, legal_name, status, owner_email, created_at, next_statuses}], total, limit, offset }" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/dashboard:
    get:
      summary: "ADMIN/STAFF/AUDITOR: live counts from the database (users, bookings and payments by status, open work queues)"
      description: Needs user.manage, portal.read or audit.read. Counts only; no money amounts.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "data: { generated_at, users: {total, active, suspended, new_last_7_days}, bookings: {by_status, created_last_7_days}, payments: {by_status}, queues: {partners_pending, tickets_open, disputes_open, refunds_open, role_requests_pending, community_reports_open} }" }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users:
    get:
      summary: "ADMIN: search and page through accounts (never returns password hash or phone)"
      description: Needs user.manage. q is a literal e-mail substring (max 100 chars); wildcards are escaped.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED] } }
        - { name: role, in: query, schema: { type: string, maxLength: 50 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: [{id, email, status, roles: string[], created_at, last_login_at}], total, limit, offset }" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{id}:
    get:
      summary: "ADMIN: one account with display name, active roles and pending role requests"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "data: { id, email, status, roles, created_at, last_login_at, display_name, pending_role_requests: [{role, request_id, created_at}] }" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: User not found }
  /admin/users/{id}/status:
    patch:
      summary: "ADMIN: suspend or reactivate an account (audited; takes effect on the next request)"
      description: >
        Needs user.manage. You cannot change your own status. A reason (3-500 chars) is required to suspend.
        Repeating the current status succeeds without writing or auditing anything.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [ACTIVE, SUSPENDED] }, reason: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: "data: { id, status }" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: User not found }
        '409': { description: Account is in a state that cannot be changed here }
  /admin/roles:
    get:
      summary: "ADMIN/AUDITOR: every role with its permission codes and how many accounts hold it (read-only)"
      description: Needs user.manage or audit.read. Roles are granted only through the role-request / approve flow.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "data: { items: [{code, name, financial, user_count, permissions: string[]}] }" }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit-logs:
    get:
      summary: "AUDITOR/CFO: read-only audit trail, newest first"
      description: Needs audit.read (System Admin deliberately does not have it). from/to are RFC 3339.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 100 } }
        - { name: subject_type, in: query, schema: { type: string, maxLength: 50 } }
        - { name: subject_id, in: query, schema: { type: string, maxLength: 36 } }
        - { name: actor, in: query, description: Actor user id, schema: { type: string, maxLength: 36 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: [{id, created_at, actor_user_id, actor_email, action, subject_type, subject_id, before, after, ip_address, request_id}], total, limit, offset }" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /community/posts:
    get:
      summary: "Community feed, newest first (posts the caller reported are hidden from the caller only)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: Post[] } where Post = {id, body, created_at, author: {display_name}, mine, tags: string[]}; e-mail addresses are never returned" }
    post:
      summary: "Publish a post immediately (no pre-moderation; max 1000 characters). Tag it afterwards with PUT /content/COMMUNITY_POST/{id}/tags."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 1000 } } }
      responses:
        '201': { description: Post created }
        '400': { $ref: '#/components/responses/ValidationError' }
  /community/posts/{id}:
    delete:
      summary: Delete one of the caller's own posts (soft delete)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /community/posts/{id}/report:
    post:
      summary: "Report a post (idempotent per user and post). The post disappears from the reporter's feed; reports are stored for staff review."
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, enum: [SPAM, ABUSE, MISLEADING, OTHER] }, detail: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: "data: { reported: true }" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /coupons/claim:
    post:
      summary: "Save a coupon code to the caller's list (case-insensitive). Does not change any price and does not use a redemption."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, maxLength: 40 } } }
      responses:
        '201': { description: "data: { saved: true }" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Already saved, expired, not valid yet, or fully redeemed" }
  /coupons/mine:
    get:
      summary: "The caller's saved coupons with their current state"
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: Coupon[] } where Coupon = {code, title, discount_type: FIXED|PERCENT, value (decimal string), valid_from, valid_until, state: ACTIVE|EXPIRED|NOT_STARTED|EXHAUSTED|UNAVAILABLE, saved_at}" }
  /portal/community/reports:
    get:
      summary: "STAFF: open moderation queue of reported community posts (most reported first)"
      description: Needs permission support.manage. Only live posts with at least one unreviewed report appear.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "data: { items: [{id, body, author_name, created_at, report_count, reasons: string[]}] }" }
        '403': { $ref: '#/components/responses/Forbidden' }
  /portal/community/posts/{id}/remove:
    post:
      summary: "STAFF: delete a reported post and close its reports (audited)"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string } } }
      responses:
        '200': { description: "data: { action: remove }" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/community/posts/{id}/dismiss:
    post:
      summary: "STAFF: keep a reported post and close its reports (audited)"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string } } }
      responses:
        '200': { description: "data: { action: dismiss }" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/queue:
    get:
      summary: Get operational queue counts for Staff or Admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "Booking, payment, partner, ticket and dispute queue counts" }
        '403': { description: Staff or Admin role required }
  /portal/bookings/{id}/status:
    patch:
      summary: Change a booking status and create an audit record
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Status changed }, '403': { description: Staff or Admin role required } }
  /portal/payments/{id}/verify:
    patch:
      summary: Verify or fail a payment and create an audit record
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Payment status changed } }
  /portal/partners/{id}/approval:
    patch:
      summary: Approve, reject, or suspend a partner and create an audit record
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Partner status changed } }
  /catalog/items:
    get:
      summary: Public catalogue of bookable items (approved partners, active items with stock from today)
      security: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: category, in: query, schema: { type: string, enum: [HOTEL, TOUR, FLIGHT, TRANSPORT, ATTRACTION] } }
      responses:
        '200': { description: "Array of {id (inventory item id, used in POST /bookings), title, category, partner_id, partner_name, from_price, currency, next_available_date}" }
        '400': { $ref: '#/components/responses/ValidationError' }
  /bookings:
    get:
      summary: The caller's own bookings, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "Array of {id, booking_code, status, currency, base_total, discount_total, payable_total, payment_status, expires_at, created_at}. Works even when financial transactions are disabled." }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a booking (server prices it; holds inventory for the payment window)
      description: Requires `booking.create`. Returns 503 FINANCIAL_TRANSACTIONS_DISABLED unless the environment safety switches allow it. No price, total or status is accepted from the client.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201': { description: "Booking created (data: BookingResult)" }
        '200': { description: "Idempotent replay of an earlier request (replayed=true)" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "Not enough availability" }
        '503': { $ref: '#/components/responses/FinancialDisabled' }
  /bookings/{id}:
    get:
      summary: One of the caller's bookings with items, cancellation terms and refunds
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "Booking summary plus items[], terms (as shown at purchase) and refunds[]" }
        '404': { $ref: '#/components/responses/NotFound' }
  /wallet:
    get:
      summary: The caller's wallet (refund credit only; there is no top-up, transfer or withdrawal)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "available_balance, pending_balance, currency, balance_type; zero when the wallet does not exist yet" }
  /wallet/transactions:
    get:
      summary: The caller's wallet ledger, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { description: "Array of {id, created_at, type, reference_type, credit_amount, debit_amount, balance_after}" }
  /payments/intents:
    post:
      summary: Create a payment intent for the caller's own unpaid booking
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntentRequest' }
      responses:
        '201': { description: "Intent created (amount comes from the booking price snapshot)" }
        '200': { description: "Idempotent replay" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Booking is not payable or its hold expired" }
        '503': { $ref: '#/components/responses/FinancialDisabled' }
  /dev/payments/simulate:
    post:
      summary: "SANDBOX ONLY: deliver a signed CHARGE_SUCCEEDED (default) or CHARGE_FAILED event for the caller's own pending intent"
      description: Exists only when the payment provider is the mock and APP_ENV is not `prod`; otherwise the route is absent (404). It goes through the same webhook handler as a real provider (signature, replay window, amount check) and uses the intent's exact amount. Never available in production.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_reference]
              properties: { payment_reference: { type: string }, outcome: { type: string, enum: [SUCCEEDED, FAILED], description: "Simulated provider result; default SUCCEEDED. FAILED leaves the booking PENDING_PAYMENT with payment_status FAILED." } }
      responses:
        '200': { description: "data: {result: webhook result (APPLIED, IGNORED_DUPLICATE, ...), sandbox: true, outcome: the event type sent}" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: "Not your intent, not pending, or the simulator does not exist in this environment" }
        '503': { $ref: '#/components/responses/FinancialDisabled' }
  /webhooks/payments:
    post:
      summary: Payment provider webhook (public; authenticated by signature)
      description: Verified with `X-Signature` (HMAC-SHA256), a 5-minute replay window and a unique provider event id. A 5xx response makes the provider retry.
      security: []
      parameters: [{ name: X-Signature, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
      responses:
        '200': { description: "Event processed or recognised as a duplicate (data.result)" }
        '400': { description: "Event timestamp outside the accepted window" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /refunds:
    post:
      summary: Request a refund for the caller's booking
      description: The amount is calculated by the server from the booking snapshot terms. Auto-approved only inside the free-cancellation window, up to the AUTO limit, for reason CUSTOMER_CANCELLATION and a partner that is not high risk.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefundRequest' }
      responses:
        '201': { description: "Refund request created (status, calculated_amount, auto_approved)" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Booking is not refundable or a refund is already open" }
        '503': { $ref: '#/components/responses/FinancialDisabled' }
  /refunds/{id}/consent:
    post:
      summary: Record the customer's consent to a wallet refund
      description: Only legally approved, currently effective consent wording is accepted; the text hash must match.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundConsentRequest' }
      responses:
        '200': { description: "Consent recorded; an approved refund is then paid out" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Refund is in the wrong state" }
        '503': { $ref: '#/components/responses/FinancialDisabled' }
  /portal/refunds/{id}/approve:
    post:
      summary: Approve a refund (requires `refund.approve`)
      description: Limits follow the approval matrix (a PROPOSAL pending finance sign-off). No self-approval; above the top limit two distinct approvers including CFO_CEO are required.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200': { description: "data.status is APPROVED, COMPLETED or still PENDING when another approver is required" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Already decided or wrong state" }
  /portal/refunds/{id}/reject:
    post:
      summary: Reject a refund (requires `refund.approve`)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200': { description: "Rejected" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Already decided or wrong state" }
  /portal/settlements/build:
    post:
      summary: Build a settlement batch for a partner and period (requires `settlement.review`)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildSettlementRequest' }
      responses:
        '201': { description: "Batch in CALCULATED state (id, items, gross, commission, net). Completed refunds of already-settled bookings appear as negative REFUND_REVERSAL items." }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "Batch already exists, nothing to settle, no commission policy, or refund reversals exceed the batch's sales (they stay pending)" }
        '503': { $ref: '#/components/responses/FinancialDisabled' }
  /portal/settlements/{id}/review:
    post:
      summary: Mark a batch as under review (requires `settlement.review`)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "UNDER_REVIEW" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Wrong state" }
  /portal/settlements/{id}/approve:
    post:
      summary: Approve a batch (requires `settlement.approve`; approver must differ from preparer and reviewer)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "APPROVED" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Wrong state" }
  /portal/settlements/{id}/payout:
    post:
      summary: Pay out an approved batch (requires `settlement.approve`)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "PAID" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Wrong state" }
        '503': { $ref: '#/components/responses/FinancialDisabled' }
  /admin/role-requests:
    post:
      summary: Request a role change (requires `role.request`); roles are never assigned directly
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleRequest' }
      responses:
        '201': { description: "Request created, awaiting a different approver" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/role-requests/{id}/approve:
    post:
      summary: Approve a role request (requester, approver and target must be three different users; financial roles need `role.approve.financial`)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "Role granted and audited in the same transaction" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Already decided" }
  /admin/role-requests/{id}/reject:
    post:
      summary: Reject a role request
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "Rejected" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  responses:
    Forbidden: { description: "Missing permission or a separation-of-duties rule (error.code FORBIDDEN)" }
    FinancialDisabled: { description: "Financial transactions are not enabled in this environment (error.code FINANCIAL_TRANSACTIONS_DISABLED)" }
    ValidationError: { description: "Invalid request (error.code VALIDATION_ERROR)" }
    Unauthorized: { description: "Missing, invalid or expired token (error.code UNAUTHORIZED)" }
    NotFound: { description: "Not found, or owned by another user (error.code NOT_FOUND)" }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        display_name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    CreateTripRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        destination_id: { type: string, maxLength: 36, description: "catalog id or UUID; not verified against destinations" }
        start_date: { type: string, description: "YYYY-MM-DD or empty" }
        end_date: { type: string, description: "YYYY-MM-DD or empty" }
    UpdateTripRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        destination_id: { type: string, maxLength: 36 }
        start_date: { type: string, description: "YYYY-MM-DD or empty to clear" }
        end_date: { type: string, description: "YYYY-MM-DD or empty to clear; at most 60 days after start_date" }
        status: { type: string, enum: [DRAFT, PLANNED, ONGOING, COMPLETED, CANCELLED] }
    CreateActivityRequest:
      type: object
      required: [title, date]
      properties:
        title: { type: string, maxLength: 200 }
        date: { type: string, format: date }
        start_time: { type: string, example: "09:30" }
        end_time: { type: string, example: "11:00", description: "requires start_time; not before it" }
        destination_id: { type: string, maxLength: 36 }
    ReviewSubjectType: { type: string, enum: [DESTINATION, HOTEL, RESTAURANT, TOUR, BOOKING] }
    CreateReviewRequest:
      type: object
      required: [subject_type, subject_id, rating]
      properties:
        subject_type: { $ref: '#/components/schemas/ReviewSubjectType' }
        subject_id: { type: string, maxLength: 36 }
        rating: { type: number, minimum: 1, maximum: 5, multipleOf: 0.5 }
        body: { type: string, maxLength: 2000 }
    CreateBookingRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [inventory_item_id, service_date, quantity]
            properties:
              inventory_item_id: { type: string, format: uuid }
              service_date: { type: string, format: date }
              quantity: { type: integer, minimum: 1 }
        coupon_code: { type: string }
    CreatePaymentIntentRequest:
      type: object
      required: [booking_id, method]
      properties:
        booking_id: { type: string, format: uuid }
        method: { type: string, description: "payment method code, e.g. PROMPTPAY_QR" }
    CreateRefundRequest:
      type: object
      required: [booking_id, method]
      properties:
        booking_id: { type: string, format: uuid }
        reason_code: { type: string, default: CUSTOMER_CANCELLATION }
        method: { type: string, enum: [ORIGINAL_METHOD, WALLET] }
    RefundConsentRequest:
      type: object
      required: [consent_version_id, text_sha256]
      properties:
        consent_version_id: { type: string }
        text_sha256: { type: string }
    DecisionRequest:
      type: object
      properties:
        reason: { type: string }
    BuildSettlementRequest:
      type: object
      required: [partner_id, period_from, period_to]
      properties:
        partner_id: { type: string, format: uuid }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        as_of: { type: string, format: date, description: "defaults to now; items inside the reconciliation window are excluded" }
    RoleRequest:
      type: object
      required: [user_id, role, reason]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string }
        reason: { type: string }
