services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: travel_super_app
      MYSQL_USER: travel
      MYSQL_PASSWORD: travel
      MYSQL_ROOT_PASSWORD: root
    ports: ["3308:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  # Applies database/migrations (up files only, tracked in schema_migrations). Do NOT mount the folder into
  # /docker-entrypoint-initdb.d: that would also execute the *.down.sql files.
  migrate:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: travel_super_app
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - ./database:/database:ro
    entrypoint: ["bash", "/database/migrate.sh", "up"]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build: ./backend
    environment:
      APP_PORT: 8080
      MYSQL_DSN: travel:travel@tcp(mysql:3306)/travel_super_app?parseTime=true
      REDIS_ADDR: redis:6379
      JWT_SECRET: development-only-change-before-production
    ports: ["8082:8080"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started
volumes:
  mysql_data:
  minio_data:
